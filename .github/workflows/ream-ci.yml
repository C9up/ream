name: ream-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_overwrite:
        description: 'Type YES to override the drift gate (force-publish even if registry version >= package.json version). Use only for rollback scenarios.'
        required: false
        default: 'no'

permissions:
  contents: read

# Cargo network hardening — applies to every job/step. crates.io downloads over
# HTTP/2 intermittently die on GitHub runners with "[16] Error in the HTTP2
# framing layer"; force HTTP/1.1, retry more, and fetch git deps via the git CLI
# (more robust than libgit2 for the C9up/* git dependencies).
env:
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_RETRY: '5'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:

  # The cross-platform matrix below exists to produce the prebuilt binaries a
  # release ships. Running it on every push to main costs five runners to
  # rebuild what nobody downloads, so it is gated on the package version
  # actually moving. Typecheck, lint and the test jobs are NOT gated: they run
  # on every push, on ubuntu, building the host binary themselves.
  #
  # `workflow_dispatch` always passes the gate — that is how a release is cut —
  # and so does anything else that is not a push.
  version-gate:
    name: Version bumped?
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v6
        with:
          # HEAD^ is what the version is read from for the comparison.
          fetch-depth: 2
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != 'push' ]; then
            echo 'bumped=true' >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} — the matrix runs unconditionally"
            exit 0
          fi
          # A missing HEAD^ (first commit on a fresh clone depth) leaves an
          # empty previous version, which reads as a bump — the matrix runs.
          # Erring towards building is the safe direction here.
          git show 'HEAD^:package.json' > "$RUNNER_TEMP/previous.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/previous.json"
          previous=$(node -p "require('$RUNNER_TEMP/previous.json').version ?? ''")
          current=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          if [ "$previous" = "$current" ]; then
            echo 'bumped=false' >> "$GITHUB_OUTPUT"
            echo "::notice::version unchanged ($current) — skipping the cross-platform matrix"
          else
            echo 'bumped=true' >> "$GITHUB_OUTPUT"
            echo "::notice::version $previous -> $current — building the cross-platform matrix"
          fi

  # Typecheck + lint quality gate — one ubuntu run (no matrix). Mirrors the
  # aggregate `verify:all` gate at the ream-dev root so a standalone clone of
  # this package enforces the same bar.
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.build.json --noEmit
      # The build project is `src` alone, so no test file was ever read by
      # `tsc`. This is the project that includes them; the 35 files still
      # excluded are named in it, so the list can only shrink.
      - run: pnpm typecheck:tests
      - run: pnpm lint
  build-and-test:
    name: Build & test (${{ matrix.suffix }})
    needs: version-gate
    if: needs.version-gate.outputs.bumped == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    suffix: linux-x64-gnu,   target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, suffix: linux-arm64-gnu, target: aarch64-unknown-linux-gnu }
          # darwin-x64 is cross-compiled on an arm64 runner (macos-13 Intel
          # runners are scarce/deprecated and leave this job queued forever).
          - { os: macos-14,         suffix: darwin-x64,      target: x86_64-apple-darwin }
          - { os: macos-14,         suffix: darwin-arm64,    target: aarch64-apple-darwin }
          - { os: windows-latest,   suffix: win32-x64-msvc,  target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Formatting is a gate, not a suggestion: left ungated, every one of these
      # crates drifted, and the drift is only ever noticed when it takes a
      # publish job down.
      - run: cargo fmt --check
      # And clippy, as an error rather than a note. `cargo fmt --check` was
      # gating the formatting while nothing gated the lints that catch a real
      # defect — the one place the compiler stays silent and clippy does not.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - run: pnpm install
      - name: Build NAPI binaries (${{ matrix.target }})
        run: pnpm build:napi
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: ream-napi-${{ matrix.suffix }}
          path: |
            index.${{ matrix.suffix }}.node
            scheduler.${{ matrix.suffix }}.node
            events.${{ matrix.suffix }}.node
          if-no-files-found: error

  # Rust test suite — platform-independent, runs once on linux. Independent of
  # `build-and-test`: that job is gated on a version bump, and waiting on it
  # would take the test signal away from every ordinary push with it.
  rust-tests:
    name: Cargo tests (linux-x64-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all

  # TypeScript: compile (produces the dist/ that ships) AND run vitest. Builds
  # the host binary on this runner — reliable, no cross-runner artefact
  # plumbing — and stages it where the http/napi integration loaders require()
  # it. That self-sufficiency is why it needs nothing from `build-and-test`,
  # which is gated on a version bump.
  ts-tests:
    name: TypeScript (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - name: Build host native binaries
        run: pnpm build:napi
      - name: Stage native binaries for integration tests
        run: |
          # http loader require()s the real ream-http-napi binary from its dir.
          cp index.*.node tests/integration/http/
          # napi-roundtrip loader require()s the ream-napi-test FIXTURE crate
          # (hello/add/noop helpers), not the production binary — build + stage it.
          cargo build --locked --release -p ream-napi-test
          cp target/release/libream_napi_test.so tests/integration/napi/index.linux-x64-gnu.node
      - name: Build TS (tsc -> dist/)
        run: pnpm build
      - run: pnpm exec vitest run --coverage

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Creating the release needs write; the workflow default is read.
      contents: write
    timeout-minutes: 15
    needs: [quality, build-and-test, rust-tests, ts-tests]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify NPM_TOKEN secret
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret missing — set in repo settings before manual publish"
            exit 1
          fi
      - name: Tag-vs-package.json gate
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$tag" ]; then
            echo "::error::HEAD has no v<X.Y.Z>-shaped tag — refuse to publish from an untagged commit"
            exit 1
          fi
          pkg_v=$(node -p "require('./package.json').version")
          if [ "$tag" != "v${pkg_v}" ]; then
            echo "::error::Tag $tag does not match package.json v${pkg_v}"
            exit 1
          fi
      - name: Drift fail-closed gate
        env:
          CONFIRM_OVERWRITE: ${{ inputs.confirm_overwrite }}
        run: |
          local_v=$(node -p "require('./package.json').version")
          npm_err=$(mktemp)
          # `if` form so `set -e` (bash -e) does not abort on a non-zero
          # `npm view` (e.g. E404 first publish) before status is captured.
          if npm_v=$(npm view --fetch-timeout=30000 @c9up/ream version 2>"$npm_err"); then status=0; else status=$?; fi
          err=$(cat "$npm_err"); rm -f "$npm_err"
          if [ "$status" -ne 0 ]; then
            if echo "$err" | grep -qE 'E404|404 Not Found'; then npm_v=""; else
              echo "::error::npm registry unreachable: $err"; exit 1; fi
          fi
          if [ -z "$npm_v" ]; then echo "First publish ($local_v)"; exit 0; fi
          if [ "$local_v" = "$npm_v" ] && [ "$CONFIRM_OVERWRITE" != "YES" ]; then
            echo "::error::$local_v already published — confirm_overwrite=YES required"; exit 1
          fi
          highest=$(printf '%s\n%s\n' "$npm_v" "$local_v" | sort -V | tail -1)
          if [ "$highest" = "$npm_v" ] && [ "$local_v" != "$npm_v" ] && [ "$CONFIRM_OVERWRITE" != "YES" ]; then
            echo "::error::Registry $npm_v > local $local_v — refuse rollback without confirm_overwrite=YES"; exit 1
          fi
      - run: pnpm install
      # Compile TS -> dist/ so the published tarball actually contains the
      # JS + .d.ts (package.json `files` ships dist/). Without this the publish
      # would pack source only and omit the compiled output.
      - name: Build TS (tsc -> dist/)
        run: pnpm build
      - uses: actions/download-artifact@v7
        with:
          pattern: ream-napi-*
          merge-multiple: true

      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        # Notes from the commits this tag contains. Without it a published
        # version arrives with no explanation of what changed, and the only way
        # to find out is to read a diff.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::notice::not built from a tag - no release to create"
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists - leaving it alone"
            exit 0
          fi
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          range="${tag}"
          [ -n "$prev" ] && range="${prev}..${tag}"
          notes="$(git log "$range" --no-merges --format='### %s%n%n%b%n' \
            | grep -vE '^### [a-z0-9@/.-]+ [0-9]+\.[0-9]+\.[0-9]+$' || true)"
          [ -z "${notes// }" ] && notes="_Version bump only - no behavioural change._"
          [ -n "$prev" ] && notes="${notes}"$'\n\n---\n\n'"Changes since \`${prev}\`."
          printf '%s\n' "$notes" | gh release create "$tag" --title "$tag" --notes-file -
