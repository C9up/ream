name: ream-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_overwrite:
        description: 'Type YES to publish a version LOWER than the one on npm (a backport to an older line). It goes out under the backport dist-tag, so latest does not move. A version npm already holds can never be published again: bump it instead.'
        required: false
        default: 'no'

permissions:
  contents: read

# Cargo network hardening — applies to every job/step. crates.io downloads over
# HTTP/2 intermittently die on GitHub runners with "[16] Error in the HTTP2
# framing layer"; force HTTP/1.1, retry more, and fetch git deps via the git CLI
# (more robust than libgit2 for the C9up/* git dependencies).
env:
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_RETRY: '5'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

concurrency:
  # Differentiated by event_name so a workflow_dispatch publish run is not
  # cancelled by a subsequent push to main mid-flight. And a dispatch never
  # cancels another one: a second "Run workflow" on the same ref used to stop
  # the first wherever it was, between `npm publish` and the release included,
  # leaving a version on npm that no rerun could finish (the drift gate then
  # refuses it as already published). Dispatch runs queue; pushes and pull
  # requests still supersede each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:

  # The cross-platform matrix below exists to produce the prebuilt binaries a
  # release ships. Running it on every push to main costs five runners to
  # rebuild what nobody downloads, so it is gated on the package version
  # actually moving. Typecheck, lint and the test jobs are NOT gated: they run
  # on every push, on ubuntu, building the host binary themselves.
  #
  # `workflow_dispatch` always passes the gate — that is how a release is cut —
  # and so does anything else that is not a push.
  version-gate:
    name: Version bumped?
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # HEAD^ is what the version is read from for the comparison.
          fetch-depth: 2
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != 'push' ]; then
            echo 'bumped=true' >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} — the matrix runs unconditionally"
            exit 0
          fi
          # A missing HEAD^ (first commit on a fresh clone depth) leaves an
          # empty previous version, which reads as a bump — the matrix runs.
          # Erring towards building is the safe direction here.
          git show 'HEAD^:package.json' > "$RUNNER_TEMP/previous.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/previous.json"
          previous=$(node -p "require('$RUNNER_TEMP/previous.json').version ?? ''")
          current=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          if [ "$previous" = "$current" ]; then
            echo 'bumped=false' >> "$GITHUB_OUTPUT"
            echo "::notice::version unchanged ($current) — skipping the cross-platform matrix"
          else
            echo 'bumped=true' >> "$GITHUB_OUTPUT"
            echo "::notice::version $previous -> $current — building the cross-platform matrix"
          fi

  # Typecheck + lint quality gate — one ubuntu run (no matrix). Mirrors the
  # aggregate `verify:all` gate at the ream-dev root so a standalone clone of
  # this package enforces the same bar.
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.build.json --noEmit
      # The build project is `src` alone, so no test file was ever read by
      # `tsc`. This is the project that includes them; the 35 files still
      # excluded are named in it, so the list can only shrink.
      - run: pnpm typecheck:tests
      - run: pnpm lint
  build-and-test:
    name: Build & test (${{ matrix.suffix }})
    needs: version-gate
    if: needs.version-gate.outputs.bumped == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    suffix: linux-x64-gnu,   target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, suffix: linux-arm64-gnu, target: aarch64-unknown-linux-gnu }
          # darwin-x64 is cross-compiled on an arm64 runner (macos-13 Intel
          # runners are scarce/deprecated and leave this job queued forever).
          - { os: macos-15,         suffix: darwin-x64,      target: x86_64-apple-darwin }
          - { os: macos-15,         suffix: darwin-arm64,    target: aarch64-apple-darwin }
          - { os: windows-latest,   suffix: win32-x64-msvc,  target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # Formatting is a gate, not a suggestion: left ungated, every one of these
      # crates drifted, and the drift is only ever noticed when it takes a
      # publish job down.
      - run: cargo fmt --check
      # And clippy, as an error rather than a note. `cargo fmt --check` was
      # gating the formatting while nothing gated the lints that catch a real
      # defect — the one place the compiler stays silent and clippy does not.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - run: pnpm install
      - name: Build NAPI binaries (${{ matrix.target }})
        run: pnpm build:napi
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
      - name: Upload artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ream-napi-${{ matrix.suffix }}
          path: |
            index.${{ matrix.suffix }}.node
            scheduler.${{ matrix.suffix }}.node
            events.${{ matrix.suffix }}.node
          if-no-files-found: error

  # Rust test suite — platform-independent, runs once on linux. Independent of
  # `build-and-test`: that job is gated on a version bump, and waiting on it
  # would take the test signal away from every ordinary push with it.
  rust-tests:
    name: Cargo tests (linux-x64-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked --all

  # TypeScript: compile (produces the dist/ that ships) AND run vitest. Builds
  # the host binary on this runner — reliable, no cross-runner artefact
  # plumbing — and stages it where the http/napi integration loaders require()
  # it. That self-sufficiency is why it needs nothing from `build-and-test`,
  # which is gated on a version bump.
  ts-tests:
    name: TypeScript (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: pnpm install
      - name: Build host native binaries
        run: pnpm build:napi
      - name: Stage native binaries for integration tests
        run: |
          # http loader require()s the real ream-http-napi binary from its dir.
          cp index.*.node tests/integration/http/
          # napi-roundtrip loader require()s the ream-napi-test FIXTURE crate
          # (hello/add/noop helpers), not the production binary — build + stage it.
          cargo build --locked --release -p ream-napi-test
          cp target/release/libream_napi_test.so tests/integration/napi/index.linux-x64-gnu.node
      - name: Build TS (tsc -> dist/)
        run: pnpm build
      # Two reporters on purpose: the JSON one feeds the zero-skipped gate, the
      # default one is what a human reads.
      - name: Vitest
        run: pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile=test-results.json
      # This job builds the host binaries, so every suite gated on them (the
      # native HTTP server, the scheduler, the stream contract, the event bus)
      # is expected to run here. A binary that stops loading, or a runner that
      # sets REAM_SKIP_NETWORK_TESTS, turns those suites into skips; without
      # this gate the run stayed green with them untested.
      - name: Gate — tests ran AND zero skipped
        run: |
          if [ ! -f test-results.json ]; then
            echo "::error::test-results.json not produced — vitest failed before writing"
            exit 1
          fi
          total=$(jq '[.testResults[].assertionResults[]] | length' test-results.json)
          if [ "$total" -eq 0 ]; then
            echo "::error::0 tests ran — test discovery is broken (check vitest include glob)"
            exit 1
          fi
          skipped=$(jq '[.testResults[].assertionResults[] | select(.status=="skipped" or .status=="pending" or .status=="todo")] | length' test-results.json)
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped tests skipped — check the native binaries load and REAM_SKIP_NETWORK_TESTS is unset"
            jq -r '.testResults[] | .name as $file | .assertionResults[] | select(.status=="skipped" or .status=="pending" or .status=="todo") | "\($file): \(.fullName)"' test-results.json
            exit 1
          fi
        shell: bash
      # The native scheduler's ticker, end to end. Cron is minute-grained, so
      # this waits up to a minute; it runs here, on its own, rather than in the
      # suite above, and is never skipped.
      - name: Slow tests (native ticker)
        run: pnpm exec vitest run tests/slow
        env:
          REAM_RUN_SLOW_TESTS: '1'

  # RustSec advisories against Cargo.lock, on every push and before every
  # publish. A lockfile nothing re-audits goes red silently: seven of them
  # had, on the hashing, TLS and sanitising paths, before this job existed.
  # Vulnerabilities and yanked crates fail it; unmaintained and unsound
  # notices are printed.
  audit:
    name: Advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Pinned and --locked: the auditor is itself a dependency of the release.
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny yanked

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Creating the release needs write; the workflow default is read.
      contents: write
      # The OIDC token npm signs the provenance with (and trusted publishing
      # authenticates with).
      id-token: write
    timeout-minutes: 15
    needs: [quality, build-and-test, rust-tests, ts-tests, audit]
    if: github.event_name == 'workflow_dispatch'
    # A publish is a deployment to npm. The environment's protection rules
    # (required reviewer, deployments from v* tags only) are what stands
    # between one write-access account and a release, and npm trusted
    # publishing is bound to this name.
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify NPM_TOKEN secret
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret missing — set in repo settings before manual publish"
            exit 1
          fi
      - name: Tag-vs-package.json gate
        id: tag
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$tag" ]; then
            echo "::error::HEAD has no v<X.Y.Z>-shaped tag — refuse to publish from an untagged commit"
            exit 1
          fi
          pkg_v=$(node -p "require('./package.json').version")
          if [ "$tag" != "v${pkg_v}" ]; then
            echo "::error::Tag $tag does not match package.json v${pkg_v}"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Drift fail-closed gate
        id: drift
        env:
          CONFIRM_OVERWRITE: ${{ inputs.confirm_overwrite }}
        run: |
          local_v=$(node -p "require('./package.json').version")
          npm_err=$(mktemp)
          # `if` form so `set -e` (bash -e) does not abort on a non-zero
          # `npm view` (e.g. E404 first publish) before status is captured.
          if npm_v=$(npm view --fetch-timeout=30000 @c9up/ream version 2>"$npm_err"); then status=0; else status=$?; fi
          err=$(cat "$npm_err"); rm -f "$npm_err"
          if [ "$status" -ne 0 ]; then
            if echo "$err" | grep -qE 'E404|404 Not Found'; then npm_v=""; else
              echo "::error::npm registry unreachable: $err"; exit 1; fi
          fi
          if [ -z "$npm_v" ]; then echo "First publish ($local_v)"; echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; exit 0; fi
          # npm refuses a version it already holds (and one unpublished less
          # than 24 h ago), whatever this gate says, so no input can make this
          # path publish: it used to be let through on confirm_overwrite=YES and
          # failed one step later with E403.
          if [ "$local_v" = "$npm_v" ]; then
            echo "::error::$local_v is already on npm, which never accepts a version twice — bump package.json"; exit 1
          fi
          highest=$(printf '%s\n%s\n' "$npm_v" "$local_v" | sort -V | tail -1)
          if [ "$highest" = "$npm_v" ]; then
            if [ "$CONFIRM_OVERWRITE" != "YES" ]; then
              echo "::error::Registry $npm_v > local $local_v — refuse to publish an older version without confirm_overwrite=YES"; exit 1
            fi
            # An older number published as `latest` would move every fresh
            # install back to it; a backport goes out under its own dist-tag.
            echo "Override accepted: publishing $local_v under the 'backport' dist-tag; latest stays $npm_v"
            echo "dist_tag=backport" >> "$GITHUB_OUTPUT"
          else
            echo "Drift gate passed: local $local_v > registry $npm_v"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install
      # Compile TS -> dist/ so the published tarball actually contains the
      # JS + .d.ts (package.json `files` ships dist/). Without this the publish
      # would pack source only and omit the compiled output.
      - name: Build TS (tsc -> dist/)
        run: pnpm build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ream-napi-*
          merge-multiple: true

      # A publish missing a platform is worse than no publish: it installs
      # cleanly and then fails to load, on the machines least able to diagnose
      # it. The upload side refuses an empty artefact, but this job alone can be
      # rerun after the run's artefacts expired, or a suffix renamed on one side
      # only, and `files` then simply packs fewer binaries.
      - name: Every platform's binaries, or nothing goes out
        run: |
          missing=0
          for suffix in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc; do
            for stem in index scheduler events; do
              if [ ! -f "${stem}.${suffix}.node" ]; then
                echo "::error::${stem}.${suffix}.node was not produced by the matrix"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -la ./*.node


      # --provenance signs the tarball with this run's OIDC identity, so every
      # version can be traced to the commit and the workflow run that built it,
      # and the same files published from a laptop are told apart. --tag is the
      # drift gate's answer: `latest`, or `backport` for an older line.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.drift.outputs.dist_tag }}
        run: |
          if [ -z "$DIST_TAG" ]; then
            echo "::error::the drift gate produced no dist-tag — refuse to publish"
            exit 1
          fi
          pnpm publish --access public --no-git-checks --provenance --tag "$DIST_TAG"
      - name: Create the GitHub release
        # Notes from the commits this tag contains. Without it a published
        # version arrives with no explanation of what changed, and the only way
        # to find out is to read a diff.
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag the gate read off HEAD. `GITHUB_REF_NAME` is the branch on a
          # dispatch from main, so the `refs/tags/main` lookup failed and the
          # step exited 0 having created nothing: a version on npm, no notes.
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          if [ -z "$tag" ]; then
            echo "::error::the tag gate produced no tag — cannot create a release"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} is not in this checkout - refusing to guess the notes range"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists - leaving it alone"
            exit 0
          fi
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          range="${tag}"
          [ -n "$prev" ] && range="${prev}..${tag}"
          notes="$(git log "$range" --no-merges --format='### %s%n%n%b%n' \
            | grep -vE '^### [a-z0-9@/.-]+ [0-9]+\.[0-9]+\.[0-9]+$' || true)"
          [ -z "${notes// }" ] && notes="_Version bump only - no behavioural change._"
          [ -n "$prev" ] && notes="${notes}"$'\n\n---\n\n'"Changes since \`${prev}\`."
          printf '%s\n' "$notes" | gh release create "$tag" --title "$tag" --notes-file -
