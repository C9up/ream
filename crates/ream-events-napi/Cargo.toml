[package]
name = "ream-events-napi"
version = "0.1.11"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NAPI bindings for the Ream event bus"

[lib]
crate-type = ["cdylib"]

[dependencies]
ream-events = { path = "../ream-events" }
ream-napi-core = { path = "../ream-napi-core" }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = { version = "3", features = ["type-def"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
napi-build = "2"
