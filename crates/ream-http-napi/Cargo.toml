[package]
name = "ream-http-napi"
version = "0.1.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NAPI bindings for the Ream Hyper HTTP server"

[lib]
crate-type = ["cdylib"]

[dependencies]
ream-http = { path = "../ream-http" }
ream-graphql = { path = "../ream-graphql" }
# Security primitives extracted to standalone packages (Epic 38).
# Blackhole = XSS/CSRF/rate-limit filter. Warden = JWT/HMAC/constant-time
# (argon2/bcrypt were dropped in Story 52.1 since Sigil is the canonical
# password-hashing service since Story 40.1). Sigil supplies argon2id +
# bcrypt + scrypt for the corresponding NAPI exports.
# git deps (not relative paths) so this crate's NAPI build resolves in an
# isolated CI checkout — the sibling repos are public and pinned to their
# v0.1.0 tag. Consumers get prebuilt .node binaries, so these only matter at
# ream's own native build time. For monorepo engine dev, override locally with
# a gitignored .cargo/config.toml `[patch]` to the sibling path.
blackhole-engine = { git = "https://github.com/C9up/blackhole", tag = "v0.1.4" }
warden-engine = { git = "https://github.com/C9up/warden", tag = "v0.1.4" }
sigil-engine = { git = "https://github.com/C9up/sigil", tag = "v0.1.4" }
ream-napi-core = { path = "../ream-napi-core" }
napi = { version = "2", default-features = false, features = ["napi8", "serde-json", "async"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
