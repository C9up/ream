[package]
name = "ream-http-napi"
version = "0.1.11"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NAPI bindings for the Ream Hyper HTTP server"

[lib]
crate-type = ["cdylib"]

[dependencies]
ream-http = { path = "../ream-http" }
ream-graphql = { path = "../ream-graphql" }
# The crypto primitives ream's TypeScript calls (HMAC, random bytes,
# constant-time compare) come from warden-engine. A git dependency (not a
# relative path) so this crate's NAPI build resolves in an isolated CI
# checkout; consumers get prebuilt .node binaries, so it only matters at
# ream's own native build time. For engine development, override it locally
# with a gitignored .cargo/config.toml `[patch]` to the sibling path.
warden-engine = { git = "https://github.com/C9up/warden", tag = "v0.2.1" }
ream-napi-core = { path = "../ream-napi-core" }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json", "async"] }
napi-derive = { version = "3", features = ["type-def"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
