[package]
name = "ream-http"
version = "0.1.12"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hyper HTTP server core for the Ream framework"

[lib]
crate-type = ["lib"]

[dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal", "io-util", "time"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
urlencoding = "2"
multer = "3"
futures-core = "0.3"
cookie = "0.18"
futures-util = "0.3"
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["server", "codegen"] }

[dev-dependencies]
tonic = { version = "0.14", default-features = false, features = ["server", "codegen", "transport"] }
# A raw HTTP/2 client: the gRPC tests send what a gRPC client never would
# (request trailers, a second message, a stream left open, a reset).
h2 = "0.4"
