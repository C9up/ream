[package]
name = "ream-graphql"
version = "0.1.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GraphQL query parser and validator for the Ream framework"

[lib]
crate-type = ["lib"]

[dependencies]
graphql-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
