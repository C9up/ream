[package]
name = "ream-scheduler-napi"
version = "0.1.11"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NAPI bindings for the Ream scheduler"

[lib]
crate-type = ["cdylib"]

[dependencies]
ream-scheduler = { path = "../ream-scheduler" }
ream-napi-core = { path = "../ream-napi-core" }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json", "async"] }
napi-derive = { version = "3", features = ["type-def"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
serde_json = "1"
